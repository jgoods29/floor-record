<form class="stack signup" data-signup style="gap:14px" novalidate>
<div class="stack" style="gap:4px"><span class="h3">Create Your Free Account</span><span class="muted">No password. We email you a link, you click it, you are in. Already have one? Same box.</span></div>
<div class="row" style="align-items:flex-end;gap:12px">
<label class="fieldset" style="flex:2 1 240px">Email<input class="field" name="email" type="email" autocomplete="email" placeholder="you@example.com" required style="width:100%"></label>
<label class="fieldset" style="flex:1 1 130px">ZIP code<input class="field" name="zip" type="text" inputmode="numeric" maxlength="5" autocomplete="postal-code" placeholder="5 digits" style="width:100%"></label>
<button class="btn" type="submit">Email Me A Sign-In Link</button>
</div>
<label class="check"><input type="checkbox" name="newsletter" checked>Send me the Monday and Friday emails: what is coming up, how Congress voted, and how my own representative and senators voted</label>
<p class="small muted" style="margin:0" data-signup-note aria-live="polite">Free. Unsubscribe or delete your account any time.</p>
</form>
